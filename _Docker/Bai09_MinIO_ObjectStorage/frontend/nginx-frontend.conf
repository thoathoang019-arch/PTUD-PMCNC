# ============================================================
# NGINX Config cho Frontend Container — Bài 09
# ============================================================
# Vai trò: Web Server phục vụ static files (SPA)
# Pattern: try_files — nếu file không tồn tại → trả về index.html
# (Tái sử dụng kiến thức Bài 08: NGINX as Web Server)
# ============================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không tìm thấy file → trả về index.html
    # Đây là cách NGINX phục vụ Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (nếu có thêm CSS/JS/images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
