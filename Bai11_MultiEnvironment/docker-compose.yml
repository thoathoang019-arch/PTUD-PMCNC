# ===================================================================
# docker-compose.yml — MÔI TRƯỜNG DEV (build từ source)
# ===================================================================
# Dùng trên MÁY DEV để phát triển local:  docker compose up -d --build
# - backend build thẳng từ Dockerfile (chưa cần image trên Registry)
# - Secret Dev lấy từ appsettings.Development.json (được commit, giá trị demo)
#
# MÁY STAGING / PRODUCTION dùng file khác: cd-machine/docker-compose.cd.yml
# (pull image theo tag từ Registry + bind-mount secret thật của máy host).
# ===================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: myapp:dev-local
    container_name: bai11-dev-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      APP_VERSION: "dev-local"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/env/info || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bai11-dev-frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: bai11-dev-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
