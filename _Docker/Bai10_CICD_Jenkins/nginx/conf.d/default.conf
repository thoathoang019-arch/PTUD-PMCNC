# ===================================================================
# NGINX REVERSE PROXY — BÀI 10: CI/CD VỚI JENKINS
# ===================================================================
# Vai trò: Reverse Proxy cho LOCAL DEVELOPMENT
# - Frontend (SPA) → frontend container
# - API requests  → backend container(s)
# - Tái sử dụng pattern từ Bài 08 (NGINX) và Bài 09 (MinIO)
# ===================================================================

# === Upstream: nhóm backend servers ===
# Round-robin load balancing (kiến thức Bài 08)
# Có thể scale bằng: docker compose up --scale backend=3
upstream backend_pool {
    server backend:8080;
}

server {
    # --- Lắng nghe port 80 ---
    listen 80;
    server_name localhost;

    # === Giới hạn kích thước request body ===
    # 50MB: đủ cho upload file (kế thừa từ Bài 09)
    client_max_body_size 50M;

    # ===================================================================
    # LOCATION BLOCKS — Routing requests
    # ===================================================================

    # --- 1. Frontend SPA ---
    # Mọi request không match /api/ → chuyển đến frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- 2. Backend API ---
    # /api/ → chuyển đến backend_pool (load balanced)
    # Proxy headers quan trọng để backend biết client thật
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài hơn cho API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- 3. Health check cho NGINX ---
    # Dùng trong Docker healthcheck và monitoring
    location /nginx-health {
        access_log off;
        return 200 "nginx-healthy\n";
        add_header Content-Type text/plain;
    }

    # === Error pages ===
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
