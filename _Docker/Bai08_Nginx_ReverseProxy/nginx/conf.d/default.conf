# ═══════════════════════════════════════════════════════════════════════
# Bài 8 — Cấu hình NGINX Reverse Proxy + Upstream (Load Balancing)
# ═══════════════════════════════════════════════════════════════════════
#
# Lộ trình cấu hình:
# 1. upstream: Định nghĩa nhóm backend server (load balancing)
# 2. server block HTTP (port 80): Reverse Proxy cho FE + BE
# 3. server block HTTPS (port 443): SSL/TLS mô phỏng
#
# Kiến thức áp dụng: Buổi 5 (Docker), Buổi 7 (Docker Compose), Buổi 8 (NGINX)
# ═══════════════════════════════════════════════════════════════════════

# ── 1. UPSTREAM: Nhóm các Backend Server ──────────────────────────────
# Khi 1 backend không đủ sức chịu tải → cần nhiều instance chạy song song.
# upstream định nghĩa nhóm server, NGINX sẽ tự động cân bằng tải giữa chúng.
#
# Mặc định: round-robin (luân phiên lần lượt)
# Các chiến lược khác:
#   least_conn;  → ưu tiên server ít kết nối nhất
#   ip_hash;     → cùng 1 IP client luôn đến cùng 1 server (sticky session)
#   weight=N;    → ưu tiên theo trọng số (server mạnh hơn nhận nhiều hơn)

upstream backend_pool {
    # Tên service "backend" trong Docker Compose tự phân giải ra IP các container
    # Nếu scale backend=3, Docker DNS trả về 3 IP → NGINX chia đều request
    server backend:8080;

    # Ví dụ với nhiều node server riêng biệt (uncomment để demo):
    # server 10.0.0.11:8080;
    # server 10.0.0.12:8080;
    # server 10.0.0.13:8080 weight=2;     # node này nhận gấp đôi request
    # server 10.0.0.14:8080 backup;       # chỉ dùng khi các server chính gặp sự cố
}

# ── 2. SERVER BLOCK HTTP (Port 80) ────────────────────────────────────
# Đây là server block chuẩn: listen, server_name, location, proxy, log

server {
    # ─── Listen: Cổng lắng nghe ───
    listen 80;

    # ─── Server Name: Domain mà block này xử lý ───
    # Dùng myapp.local để giả lập domain (cấu hình trong file hosts)
    # Thêm localhost để vẫn truy cập được qua localhost khi chưa sửa hosts
    server_name myapp.local localhost;

    # ─── Log riêng cho server block này ───
    # Mỗi domain/ứng dụng nên có log riêng để dễ debug
    access_log /var/log/nginx/myapp_access.log;
    error_log  /var/log/nginx/myapp_error.log;

    # ─── client_max_body_size: Giới hạn kích thước body request ───
    # Mặc định NGINX chỉ cho phép body tối đa 1MB
    # Request lớn hơn (upload file, ảnh) → lỗi 413 Request Entity Too Large
    # Tăng lên 20MB để cho phép upload file
    client_max_body_size 20M;

    # ─── Location /: Phục vụ Frontend (file tĩnh hoặc proxy tới container FE) ───
    # Cách 1: Proxy tới container frontend riêng (dùng trong Docker)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Cách 2: Phục vụ trực tiếp file tĩnh (không dùng container FE riêng)
    # location / {
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;   # Cần cho SPA
    # }

    # ─── Location /api/: Reverse Proxy tới Backend qua Upstream ───
    # Mọi request /api/... sẽ được chuyển tiếp tới nhóm backend_pool
    # Client gọi cùng domain (/) → không bị lỗi CORS!
    location /api/ {
        proxy_pass http://backend_pool;

        # ─── Proxy Headers quan trọng ───
        # Mặc định NGINX KHÔNG tự chuyển tiếp thông tin gốc của request
        # Nếu thiếu → backend thấy mọi request đều từ NGINX (127.0.0.1)
        # → không thể log IP thật, rate-limit, hay phân tích user
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;           # IP thật của client
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # Chuỗi IP qua các proxy
        proxy_set_header X-Forwarded-Proto $scheme;                # http hay https

        # ─── Response Header: cho frontend biết backend nào đã xử lý request ───
        # $upstream_addr = IP:Port của container backend vừa phục vụ (VD: 172.18.0.4:8080)
        # Dùng để demo load balancing: mỗi lần gọi sẽ thấy IP khác nhau
        add_header X-Served-By $upstream_addr always;

        # Timeout cho proxy (tùy chỉnh nếu backend xử lý lâu)
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
    }
}

# ── 3. SERVER BLOCK HTTPS (Port 443) — SSL/TLS Mô phỏng ─────────────
# Dùng chứng chỉ tự ký (self-signed) để giả lập HTTPS local
# Lưu ý: Trình duyệt sẽ cảnh báo "Not Secure" vì chứng chỉ tự ký
#         không nằm trong chain of trust (không có Root CA tin cậy ký)
# Trên production: dùng Certbot (Let's Encrypt) để lấy chứng chỉ MIỄN PHÍ
#   → certbot --nginx -d yourdomain.com

server {
    listen 443 ssl;
    server_name myapp.local;

    # ─── Chứng chỉ SSL (tự ký) ───
    # Tạo bằng lệnh:
    #   openssl req -x509 -nodes -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/myapp.key \
    #     -out /etc/nginx/ssl/myapp.crt \
    #     -days 365 -subj "/CN=myapp.local"
    ssl_certificate     /etc/nginx/ssl/myapp.crt;
    ssl_certificate_key /etc/nginx/ssl/myapp.key;

    # Cấu hình SSL tối thiểu (best practice)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/myapp_ssl_access.log;
    error_log  /var/log/nginx/myapp_ssl_error.log;

    client_max_body_size 20M;

    # Cấu hình giống server block HTTP
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Response Header cho demo load balancing (giống server block HTTP)
        add_header X-Served-By $upstream_addr always;
    }
}
