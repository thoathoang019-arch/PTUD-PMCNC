# Cấu hình Nginx đóng vai trò Load Balancer (Cân bằng tải)
# Nginx sẽ nhận request từ bên ngoài (cổng 80) và chia đều cho các container Backend

upstream backend_servers {
    # Nhờ cơ chế Service Discovery của Docker Compose, tên 'backend' sẽ tự động
    # phân giải ra danh sách IP của tất cả các container backend đang chạy.
    server backend:8080;
}

server {
    listen 80;

    # Cấu hình log để dễ debug
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        # Điều phối request sang upstream 'backend_servers'
        proxy_pass http://backend_servers;
        
        # Chuyển tiếp các thông tin quan trọng từ client thật vào cho backend biết
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
