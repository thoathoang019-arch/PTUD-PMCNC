# Cấu hình NGINX phục vụ file tĩnh cho Frontend (SPA)
# File này được dùng BÊN TRONG container frontend riêng (nếu tách container FE ra)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # try_files: Quan trọng cho SPA (Single Page Application)!
        # Thứ tự thử: file gốc → thư mục → fallback về index.html
        # Giúp client-side routing (React Router, Vue Router) hoạt động đúng
        try_files $uri $uri/ /index.html;
    }
}
