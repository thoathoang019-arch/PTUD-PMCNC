# ============================================================
# NGINX Reverse Proxy — Bài 09: MinIO Object Storage
# ============================================================
# Tái sử dụng kiến thức Bài 08:
#   - Upstream: load balancing cho backend (round-robin)
#   - Reverse Proxy: proxy_pass + proxy_set_header
#   - Web Server: serve frontend qua proxy
#   - client_max_body_size: giới hạn upload (quan trọng với MinIO!)
#
# Kiến trúc:
#   Client ──► NGINX (:80)
#                ├── /           → frontend:80  (SPA)
#                ├── /api/       → backend_pool (ASP.NET Core)
#                └── /minio-console/ → minio:9001 (MinIO Console)
# ============================================================

# ── Upstream: nhóm backend servers ──────────────────────────
# Khi scale: docker compose up --scale backend=3
# NGINX tự động round-robin giữa các instance
upstream backend_pool {
    # Docker Compose service discovery: tên service = hostname
    server backend:8080;

    # Các thuật toán khác (bỏ comment để thử):
    # least_conn;           # Ưu tiên server ít connection nhất
    # ip_hash;              # Cùng IP → cùng server (sticky session)
    # server backend:8080 weight=3;  # Server này nhận gấp 3 request
}

# ── HTTP Server Block ──────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # ── client_max_body_size ────────────────────────────────
    # QUAN TRỌNG với MinIO: cho phép upload file lớn
    # Mặc định NGINX chỉ cho 1MB → lỗi 413 Entity Too Large
    # Đặt 100M để demo upload file lớn qua Object Storage
    client_max_body_size 100M;

    # ── Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Location: Frontend (Web Server) ─────────────────────
    # NGINX đóng vai trò Reverse Proxy → forward đến frontend container
    # Frontend container bên trong cũng chạy NGINX (serve static files)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Location: Backend API (Reverse Proxy + Load Balancing)
    # /api/ → upstream backend_pool
    # Các header quan trọng:
    #   X-Real-IP: IP thật của client (không phải IP của NGINX)
    #   X-Forwarded-For: chuỗi proxy đã đi qua
    #   X-Forwarded-Proto: protocol gốc (http/https)
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài hơn cho upload file lớn
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Location: MinIO API (S3-compatible endpoint) ────────
    # Cho phép truy cập MinIO API qua NGINX (optional)
    # Presigned URLs cần truy cập trực tiếp MinIO → dùng port 9000
    location /s3/ {
        rewrite ^/s3/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cần cho upload file lớn qua S3 API
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Health check endpoint ───────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "OK - Bai09 NGINX is running\n";
        add_header Content-Type text/plain;
    }
}
