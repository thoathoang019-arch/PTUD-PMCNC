# ===================================================================
# NGINX FRONTEND CONFIG — BÀI 10: CI/CD VỚI JENKINS
# ===================================================================
# Cấu hình phục vụ file tĩnh cho SPA (Single Page Application)
# Pattern giống Bài 08, 09 — tái sử dụng kiến thức đã học
# ===================================================================

server {
    # --- Lắng nghe port 80 trong container ---
    listen 80;
    server_name localhost;

    # --- Document root: nơi chứa file HTML/CSS/JS ---
    root /usr/share/nginx/html;
    index index.html;

    # === SPA Routing ===
    # try_files: thử tìm file theo URI, nếu không có → trả về index.html
    # Quan trọng cho SPA: mọi route đều do JavaScript xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Cache cho file tĩnh ===
    # File CSS, JS, hình ảnh: cache 1 ngày để tăng tốc
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # === Gzip compression ===
    # Nén response để giảm bandwidth, tăng tốc tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # === Health check endpoint ===
    location /health {
        access_log off;
        return 200 "frontend-ok\n";
        add_header Content-Type text/plain;
    }
}
